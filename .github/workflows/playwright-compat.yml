name: Playwright compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compat:
    name: Playwright ${{ matrix.playwright }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        playwright:
          # Floor: the minimum version our peerDependency promises to support.
          # If a test fails here, either fix the code or raise the peer range.
          # Bumped 1.40 -> 1.49 when human.outline() adopted `ariaSnapshot`
          # (added in Playwright 1.49); kept in sync with @humanjs/playwright's
          # peerDependencies range.
          - "1.49.0"
          # Current latest, to catch regressions on new releases.
          - "latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @humanjs/core
        # @humanjs/playwright imports the workspace package via its `exports`
        # field which points at `dist/`. Without this, typecheck and tests
        # can't resolve `@humanjs/core`.
        run: pnpm --filter @humanjs/core build

      - name: Pin Playwright to matrix version
        # Pin BOTH playwright and @playwright/test — they ship in lockstep and a
        # real install always has them on the same version. The `/test` fixture
        # bridges them (its `page` comes from @playwright/test, passed to
        # createHuman which types `Page` from playwright), so a version skew here
        # would surface a phantom type mismatch that no real user hits.
        run: pnpm --filter @humanjs/playwright add -D playwright@${{ matrix.playwright }} @playwright/test@${{ matrix.playwright }}

      - name: Typecheck against this Playwright version
        run: pnpm --filter @humanjs/playwright typecheck

      - name: Run @humanjs/playwright tests
        run: pnpm --filter @humanjs/playwright test
